name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_7MDUX8Yd8QpiBAw83XjPg3SN
  VERCEL_PROJECT_ID: prj_DukX0C4oC0HhzDzvVOzeXu5ZhGUI
  VERCEL_SCOPE: assn42357s-projects

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Verify Vercel authentication
        run: |
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}"
          vercel teams ls --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Link existing Vercel project
        run: vercel link --yes --project=efootball --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pull production settings
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"
